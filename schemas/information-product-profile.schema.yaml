$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/frecke/datagovops/schemas/information-product-profile.schema.yaml
title: Experimental DataGovOps information product profile
description: >-
  Proposed representation of a governed, technology-independent information
  asset and its technical realizations. Validation establishes representation
  and internal consistency, not legal or archival compliance.
type: object
additionalProperties: false
required:
  - apiVersion
  - kind
  - metadata
  - spec
properties:
  apiVersion:
    const: datagovops.org/v0alpha1
  kind:
    const: InformationProduct
  metadata:
    type: object
    additionalProperties: false
    required:
      - identifier
      - name
      - semanticVersion
      - status
    properties:
      identifier:
        type: string
        format: uri
      name:
        type: string
        pattern: "^[a-z][a-z0-9-]{2,62}$"
      semanticVersion:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      status:
        enum:
          - proposed
          - active
          - deprecated
          - retired
  spec:
    type: object
    additionalProperties: false
    required:
      - accountability
      - purpose
      - semantics
      - realizations
    properties:
      accountability:
        type: object
        additionalProperties: false
        required:
          - informationOwner
        properties:
          informationOwner:
            type: string
            minLength: 1
          steward:
            type: string
            minLength: 1
      purpose:
        type: object
        additionalProperties: false
        required:
          - description
        properties:
          description:
            type: string
            minLength: 1
          intendedConsumers:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
      semantics:
        type: object
        additionalProperties: false
        required:
          - language
          - concepts
        properties:
          language:
            type: string
            pattern: "^[a-z]{2}(-[A-Z]{2})?$"
          concepts:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
                - identifier
                - preferredLabel
              properties:
                identifier:
                  type: string
                  format: uri
                preferredLabel:
                  type: string
                  minLength: 1
                definition:
                  type: string
      realizations:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - dataProduct
          properties:
            dataProduct:
              type: string
              format: uri
            contractReferences:
              type: array
              uniqueItems: true
              items:
                type: string
                format: uri
      usageDecisions:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - purpose
            - decision
            - authority
            - validFrom
          properties:
            purpose:
              type: string
              minLength: 1
            decision:
              enum:
                - permitted
                - prohibited
                - conditional
                - not-assessed
            authority:
              type: object
              additionalProperties: false
              required:
                - decisionReference
                - decidedBy
              properties:
                decisionReference:
                  type: string
                  minLength: 1
                decidedBy:
                  type: string
                  minLength: 1
            validFrom:
              type: string
              format: date
            reviewAfter:
              type: string
              format: date
            rationale:
              type: string
            evidenceReferences:
              type: array
              uniqueItems: true
              items:
                type: string
                format: uri

