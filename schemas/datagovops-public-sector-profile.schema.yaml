$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/frecke/datagovops/schemas/datagovops-public-sector-profile.schema.yaml
title: DataGovOps public-sector data product profile
description: Experimental representation of governance, semantic, provenance and archival-readiness metadata.
type: object
additionalProperties: false
required:
  - apiVersion
  - kind
  - metadata
  - spec
properties:
  apiVersion:
    const: datagovops.org/v0alpha1
  kind:
    const: DataProduct
  metadata:
    type: object
    additionalProperties: false
    required:
      - name
      - version
      - status
    properties:
      name:
        type: string
        pattern: "^[a-z][a-z0-9-]{2,62}$"
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      status:
        enum:
          - proposed
          - active
          - deprecated
          - retired
  spec:
    type: object
    additionalProperties: false
    required:
      - accountability
      - semantics
      - lifecycle
      - provenance
    properties:
      accountability:
        type: object
        additionalProperties: false
        required:
          - informationOwner
          - dataProductOwner
          - systemOfRecord
        properties:
          informationOwner:
            type: string
            minLength: 1
          dataProductOwner:
            type: string
            minLength: 1
          systemOfRecord:
            type: string
            minLength: 1
      semantics:
        type: object
        additionalProperties: false
        required:
          - language
          - concepts
        properties:
          language:
            type: string
            pattern: "^[a-z]{2}(-[A-Z]{2})?$"
          concepts:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
                - identifier
                - preferredLabel
              properties:
                identifier:
                  type: string
                  format: uri
                preferredLabel:
                  type: string
                  minLength: 1
                definition:
                  type: string
      lifecycle:
        type: object
        additionalProperties: false
        required:
          - archivalStatus
          - disposition
          - retentionDecisionStatus
        properties:
          archivalStatus:
            enum:
              - not-assessed
              - current-record
              - archival-record
          retentionDecisionStatus:
            enum:
              - not-assessed
              - proposed
              - approved
          disposition:
            enum:
              - retain
              - review
              - destroy
          retentionPeriod:
            type: string
            description: ISO 8601 duration when a time-based period applies.
          decisionReference:
            type: string
          preservationFormat:
            type: array
            items:
              type: string
          exportability:
            type: boolean
      provenance:
        type: object
        additionalProperties: false
        required:
          - sourceSystems
          - lineageDocumented
          - changeHistoryAvailable
        properties:
          sourceSystems:
            type: array
            minItems: 1
            items:
              type: string
          lineageDocumented:
            type: boolean
          changeHistoryAvailable:
            type: boolean
          authenticityEvidence:
            type: array
            items:
              type: string
      quality:
        type: object
        additionalProperties: false
        properties:
          rulesetReference:
            type: string
          lastAssessment:
            type: string
            format: date-time
